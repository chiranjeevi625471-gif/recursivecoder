<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enroll Now | Recursive Coders</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Page Specific Overrides for Centered Form */
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #ffffff;
            margin: 0;
            padding: 20px;
        }

        .enroll-container {
            background: #ffffff;
            padding: 40px;
            border-radius: 20px;
            width: 100%;
            max-width: 500px;
            border: 1px solid #e5e5e5;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.12);
            position: relative;
            animation: fadeIn 0.5s ease-out;
        }

        .enroll-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .enroll-header h2 {
            font-size: 2rem;
            color: #000000;
            margin-bottom: 5px;
        }

        .enroll-header p {
            color: #555555;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #000000;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid #cccccc;
            background: #ffffff;
            color: #000000;
            outline: none;
            font-family: 'Poppins', sans-serif;
            transition: 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--primary);
            background: #ffffff;
            box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.1);
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #666;
            font-size: 1.5rem;
            text-decoration: none;
            transition: 0.3s;
        }

        .close-btn:hover {
            color: #000000;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>

    <div class="enroll-container">
        <a href="index.html" class="close-btn">&times;</a>
        
        <div class="enroll-header">
            <h2>Secure Your Spot</h2>
            <p>Enroll in <span id="course-name-display" style="color: #000000; font-weight: 700;">Recursive Coders</span></p>
        </div>

        <form id="enrollForm">
            <input type="hidden" id="e-course">

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="e-name" required placeholder="John Doe">
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="e-email" required placeholder="john@example.com">
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="e-phone" required placeholder="+91 98765 43210">
            </div>

            <div class="form-group">
                <label>College / Company</label>
                <input type="text" id="e-college" required placeholder="University Name">
            </div>

            <div class="form-group">
                <label>Highest Qualification</label>
                <select id="e-degree" required>
                    <option value="" disabled selected>Select Degree</option>
                    <option value="B.Tech/B.E">B.Tech / B.E</option>
                    <option value="BCA/MCA">BCA / MCA</option>
                    <option value="B.Sc/M.Sc">B.Sc / M.Sc</option>
                    <option value="Diploma">Diploma</option>
                    <option value="Working Professional">Working Professional</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>Year of Passing</label>
                <input type="number" id="e-yop" required placeholder="2024">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Confirm Enrollment</button>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 1. Auto-fill Course from URL (e.g. enroll.html?course=python)
            const params = new URLSearchParams(window.location.search);
            const courseParam = params.get('course');
            
            const displaySpan = document.getElementById('course-name-display');
            const hiddenInput = document.getElementById('e-course');

            if (courseParam) {
                // Format: "java-full-stack" -> "JAVA FULL STACK"
                const formattedName = courseParam.replace(/-/g, ' ').toUpperCase();
                displaySpan.textContent = formattedName;
                hiddenInput.value = formattedName;
            } else {
                hiddenInput.value = "General Enrollment";
            }

            // 2. Handle Form Submission
            document.getElementById('enrollForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const formData = {
                    name: document.getElementById('e-name').value,
                    email: document.getElementById('e-email').value,
                    phone: document.getElementById('e-phone').value,
                    college: document.getElementById('e-college').value,
                    degree: document.getElementById('e-degree').value,
                    yop: document.getElementById('e-yop').value,
                    course: document.getElementById('e-course').value
                };
                const body = Object.entries(formData)
                    .map(([label, value]) => `${label}: ${value}`)
                    .join('\n');
                alert('Your email app will open with your enrollment request. Send the email to complete it.');
                window.location.href = `mailto:info@recursivecoders.com?subject=${encodeURIComponent('Course enrollment request')}&body=${encodeURIComponent(body)}`;
            });
        });
    </script>

</body>
</html>
