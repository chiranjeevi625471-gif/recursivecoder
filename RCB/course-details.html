<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Details | Recursive Coders</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header id="header">
        <div class="container">
            <nav>
                <a href="index.html" class="logo">
                     <img src="assets/Recursive Coders.png" alt="" >
                </a>
                
                <div class="menu-btn" id="menuBtn"><i class="fas fa-bars"></i></div>

                <ul class="nav-links" id="navLinks">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="index.html#courses">Courses</a></li>
                    <li><a href="index.html#testimonials">Stories</a></li>
                    <li><a href="index.html#contact">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="header-banner" style="padding-top: 140px; padding-bottom: 60px; text-align: center; background: radial-gradient(circle at center, rgba(255, 215, 0, 0.15) 0%, transparent 70%);">
        <div class="container">
            <span class="badge" id="course-badge" style="margin-bottom: 20px; display: inline-block; color: var(--primary); border: 1px solid var(--primary); padding: 5px 15px; border-radius: 20px;">2026 Syllabus</span>
            <h1 id="course-title" style="font-size: 2.5rem; margin-bottom: 20px; text-shadow: 0 0 10px rgba(255,215,0,0.3);">Loading...</h1>
            <p id="course-desc" style="color: var(--text-gray); max-width: 700px; margin: 0 auto 30px auto; font-size: 1.1rem; line-height: 1.6;">
                Please wait while we fetch the roadmap...
            </p>
            <button class="btn btn-primary" onclick="goToEnroll()">Enroll Now</button>
        </div>
    </section>

    <section class="container section-padding">
        <div class="roadmap-grid">
            
            <aside class="course-sidebar" style="background: rgba(255,255,255,0.03); padding: 30px; border-radius: 20px; height: fit-content; border: 1px solid rgba(255,215,0,0.2);">
                <div style="margin-bottom: 30px;">
                    <h4 style="color: var(--primary); margin-bottom: 15px;"><i class="fas fa-info-circle"></i> Quick Info</h4>
                    <ul style="color: #ccc; line-height: 2;">
                        <li><i class="fas fa-clock" style="width: 25px;"></i> Duration: <span id="duration" style="color: white; font-weight: 600;">--</span></li>
                        <li><i class="fas fa-layer-group" style="width: 25px;"></i> Level: <span id="level" style="color: white; font-weight: 600;">--</span></li>
                        <li><i class="fas fa-certificate" style="width: 25px;"></i> Certification Included</li>
                    </ul>
                </div>
                <div>
                    <h4 style="color: var(--primary); margin-bottom: 15px;"><i class="fas fa-tools"></i> Tech Stack</h4>
                    <p id="tech-stack" style="color: #ccc; font-size: 0.95rem; line-height: 1.6;">--</p>
                </div>
            </aside>

            <div class="roadmap-content">
                <h2 style="margin-bottom: 30px;">Curriculum <span style="color: var(--primary);">Roadmap</span></h2>
                
                <div id="roadmap-timeline">
                    <div id="road-boy">
                        <i class="fas fa-running"></i>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <div class="container" style="text-align: center; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 20px; color: var(--text-gray);">
            <p>&copy; 2026 Recursive Coders. All rights reserved.</p>
        </div>
    </footer>

    <script src="course-data.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Mobile Menu
            const menuBtn = document.getElementById('menuBtn');
            const navLinks = document.getElementById('navLinks');
            if(menuBtn) {
                menuBtn.addEventListener('click', () => {
                    navLinks.classList.toggle('active');
                });
            }

            // URL Params
            const params = new URLSearchParams(window.location.search);
            const topic = params.get('topic'); 

            if (!topic) { window.location.href = 'index.html'; return; }

            // Find Course Data
            let courseKey = null;
            if (typeof courseData !== 'undefined' && courseData[topic]) {
                courseKey = topic;
            } else if (typeof courseData !== 'undefined') {
                courseKey = Object.keys(courseData).find(key => topic.toLowerCase().includes(key));
            }

            if(!courseKey || !courseData[courseKey]) {
                document.getElementById('course-title').textContent = "Course Not Found";
                document.getElementById('course-desc').textContent = "We couldn't find a roadmap for that topic.";
                return;
            }

            const data = courseData[courseKey]; 

            document.getElementById('course-title').textContent = data.title;
            document.getElementById('course-desc').textContent = data.description;
            document.getElementById('duration').textContent = data.duration;
            document.getElementById('level').textContent = data.level;
            document.getElementById('tech-stack').textContent = data.technologies;

            const timelineContainer = document.getElementById('roadmap-timeline');
            const boyElement = document.getElementById('road-boy');
            
            // Build HTML
            let html = '';
            data.roadmap.forEach((module, index) => {
                const isLast = index === data.roadmap.length - 1;
                html += `
                    <div class="timeline-item" style="display: flex; gap: 20px; margin-bottom: 40px; position: relative;">
                        <div style="display: flex; flex-direction: column; align-items: center; min-width: 20px; margin-left: 10px;">
                            <div class="timeline-marker"></div>
                            <div class="road-line" style="display: ${isLast ? 'none' : 'block'}; height: 100%;"></div>
                        </div>
                        
                        <div class="module-card" style="background: var(--bg-card); padding: 25px; border-radius: 15px; width: 100%; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 5px 15px rgba(0,0,0,0.2);">
                            <span style="font-size: 0.8rem; color: var(--primary); font-weight: 600; text-transform: uppercase;">${module.week}</span>
                            <h3 style="margin: 5px 0 15px 0; color: white;">${module.topic}</h3>
                            <ul style="color: var(--text-gray); list-style: disc; margin-left: 20px; line-height: 1.6;">
                                ${module.details.map(detail => `<li>${detail}</li>`).join('')}
                            </ul>
                        </div>
                    </div>
                `;
            });
            
            // Inject content but keep the boy
            timelineContainer.innerHTML = ''; 
            timelineContainer.appendChild(boyElement); 
            timelineContainer.insertAdjacentHTML('beforeend', html);

            // Scroll Logic for Moving Boy
            const roadmapSection = document.getElementById('roadmap-timeline');
            window.addEventListener('scroll', () => {
                if(!roadmapSection) return;
                const rect = roadmapSection.getBoundingClientRect();
                const sectionTop = rect.top + window.scrollY;
                const sectionHeight = roadmapSection.scrollHeight;
                const viewportHeight = window.innerHeight;
                const scrollY = window.scrollY;
                
                // Calculate position relative to viewport center
                const startPoint = sectionTop - (viewportHeight / 2);
                const distanceScrolled = scrollY - startPoint;
                let progress = distanceScrolled / (sectionHeight);

                if (progress < 0) progress = 0;
                if (progress > 0.95) progress = 0.95; 

                boyElement.style.top = (progress * 100) + '%';
            });
        });

        function goToEnroll() {
            const params = new URLSearchParams(window.location.search);
            const topic = params.get('topic');
            window.location.href = `enroll.html?course=${topic}`;
        }
    </script>
</body>
</html>
